<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>端侧模型连通测试</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; line-height: 1.6; }
  button { font-size: 15px; padding: 8px 16px; margin: 12px 0; }
  textarea { width: 100%; height: 90px; font-size: 14px; }
  #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px;
         background: #f5f5f5; padding: 12px; border-radius: 6px; min-height: 120px; }
</style>
</head>
<body>
<h1>端侧模型连通测试</h1>
<p>用来确认 Chrome 能否创建并调用 Gemini Nano。本页不连接 Firebase，也不发送任何内容到外部。</p>

<button id="run">检查并下载模型</button>

<p>下载完成后可直接测试生成：</p>
<textarea id="prompt">用三句话说明什么是混合推理。</textarea>
<button id="gen">运行生成</button>

<div id="log"></div>

<script>
const logEl = document.getElementById('log');

function log(text) {
  const time = new Date().toLocaleTimeString();
  logEl.textContent += `[${time}] ${text}\n`;
}

async function checkAvailability() {
  if (!('LanguageModel' in self)) {
    return 'unavailable: LanguageModel 不存在（Chrome 版本过低或实验开关未启用）';
  }
  try {
    return await LanguageModel.availability();
  } catch (err) {
    return 'unavailable: ' + err.message;
  }
}

document.getElementById('run').addEventListener('click', async () => {
  logEl.textContent = '';
  const state = await checkAvailability();
  log('availability: ' + state);
  if (state === 'unavailable') {
    log('本机无法运行端侧模型');
    return;
  }
  log('开始创建会话，未下载时会触发下载');
  const started = performance.now();
  try {
    const session = await LanguageModel.create({
      monitor(m) {
        m.addEventListener('downloadprogress', (e) => {
          const pct = (e.loaded * 100).toFixed(1);
          log('下载进度 ' + pct + '%');
        });
      },
    });
    const seconds = ((performance.now() - started) / 1000).toFixed(1);
    log('会话创建成功，耗时 ' + seconds + ' 秒');
    const after = await checkAvailability();
    log('创建后 availability: ' + after);
    session.destroy();
  } catch (err) {
    log('创建失败: ' + err.name + ' ' + err.message);
  }
});

document.getElementById('gen').addEventListener('click', async () => {
  const text = document.getElementById('prompt').value;
  try {
    const session = await LanguageModel.create();
    log('生成中');
    const reply = await session.prompt(text);
    log('回复:\n' + reply);
    session.destroy();
  } catch (err) {
    log('生成失败: ' + err.name + ' ' + err.message);
  }
});
</script>
</body>
</html>
